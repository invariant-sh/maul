[package]
name = "maul"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Adversarial HTTP proxy for LLM agent reliability testing"
repository = "https://github.com/invariant-sh/maul"

[dependencies]
axum = "0.8.9"
futures-util = "0.3.33"
rand = "0.10.2"
reqwest = { version = "0.13.4", default-features = true, features = ["stream", "gzip", "brotli", "deflate"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_yaml = "0.9.34"
tokio = { version = "1.53.1", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
flate2 = "1.1.9"
tempfile = "3.27.0"
wiremock = "0.6.5"
