name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
          - os: macos-14
            target: aarch64-apple-darwin
          - os: macos-14
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux arm64 cross linker
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu libc6-dev-arm64-cross cmake pkg-config
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"
          echo "CC_aarch64_unknown_linux_gnu=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"

      - name: Build release binary
        run: cargo build --locked --release --target ${{ matrix.target }}

      - name: Package archive
        shell: bash
        run: |
          bash ci/package_release.sh \
            "${{ matrix.target }}" \
            "${GITHUB_REF_NAME}" \
            "target/${{ matrix.target }}/release/maul" \
            dist

      - name: Upload archive
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: maul-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download archives
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true

      - name: Verify checksums and extract the Linux binary
        id: extract
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          version="${GITHUB_REF_NAME}"
          expected=(
            "maul-${version}-x86_64-unknown-linux-gnu.tar.gz"
            "maul-${version}-aarch64-unknown-linux-gnu.tar.gz"
            "maul-${version}-aarch64-apple-darwin.tar.gz"
            "maul-${version}-x86_64-apple-darwin.tar.gz"
          )
          for name in "${expected[@]}"; do
            if [[ ! -f "dist/${name}" || ! -f "dist/${name}.sha256" ]]; then
              echo "Missing release asset ${name}"
              exit 1
            fi
          done
          (
            cd dist
            sha256sum -c ./*.sha256
          )
          archive="dist/maul-${version}-x86_64-unknown-linux-gnu.tar.gz"
          mkdir -p "${RUNNER_TEMP}/maul-release"
          tar -xzf "${archive}" -C "${RUNNER_TEMP}/maul-release" --strip-components=1
          chmod +x "${RUNNER_TEMP}/maul-release/maul"
          echo "maul-path=${RUNNER_TEMP}/maul-release/maul" >> "${GITHUB_OUTPUT}"

      - name: Start fake OpenAI upstream
        run: |
          python3 ci/fake_openai.py &
          for _ in $(seq 1 50); do
            if python3 -c "import urllib.request; urllib.request.urlopen(urllib.request.Request('http://127.0.0.1:18776/', method='POST', data=b'{}', headers={'Content-Type':'application/json'}), timeout=0.2)"; then
              exit 0
            fi
            sleep 0.1
          done
          echo "fake OpenAI did not become ready"
          exit 1

      - name: Run maul-test against the release asset
        uses: ./.github/actions/maul-test
        with:
          binary-path: ${{ steps.extract.outputs.maul-path }}
          version: ${{ github.ref_name }}
          config: ci/maul.force500.yaml
          agent: python3 ci/retry_agent.py
          report: artifacts/release-dogfood.json
          fail-on: resilience
          artifact-name: maul-release-dogfood

      - name: Assert release dogfood report
        run: python3 ci/assert_report.py artifacts/release-dogfood.json --expect recovered

      - name: Publish release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/*.sha256
